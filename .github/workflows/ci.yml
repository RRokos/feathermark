name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mdreader/package-lock.json

      - name: Install dependencies
        working-directory: mdreader
        run: npm ci

      - name: Run tests
        working-directory: mdreader
        run: npm test

      - name: Type check
        working-directory: mdreader
        run: npm run check

      - name: Build frontend
        working-directory: mdreader
        run: npm run build
